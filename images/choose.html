<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Betterbird icons</title>
<style>
  body { font-family: Segoe UI, sans-serif; background: #161616; color: #f2f2f2; margin: 32px; }
  h1 { font-size: 22px; font-weight: 600; }
  p { color: #c8c8c8; }
  table { border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 18px; border-bottom: 1px solid #333; vertical-align: middle; }
  th { color: #aaa; font-weight: 600; }
  img { width: 64px; height: 64px; background: #000; }
  .num { font-size: 24px; }
  .yours { color: #9ee7c4; }
</style>
</head>
<body>
<h1>Betterbird icons</h1>
<p>Type the number in the menu. Number 1 is yours. The new-mail picture is the same bird with a dot.</p>
<table>
  <tr><th></th><th>Name</th><th>Window</th><th>New mail</th></tr>
  <tr><td class="num">1</td><td class="yours">blue, yours</td><td><img src="../icons/blue/messengerWindow.ico" alt=""></td><td><img src="../icons/blue/newmail.ico" alt=""></td></tr>
  <tr><td class="num">2</td><td>bb</td><td><img src="../icons/bb/messengerWindow.ico" alt=""></td><td><img src="../icons/bb/newmail.ico" alt=""></td></tr>
  <tr><td class="num">3</td><td>bb-green</td><td><img src="../icons/bb-green/messengerWindow.ico" alt=""></td><td><img src="../icons/bb-green/newmail.ico" alt=""></td></tr>
  <tr><td class="num">4</td><td>green2</td><td><img src="../icons/green2/messengerWindow.ico" alt=""></td><td><img src="../icons/green2/newmail.ico" alt=""></td></tr>
  <tr><td class="num">5</td><td>uk</td><td><img src="../icons/uk/messengerWindow.ico" alt=""></td><td><img src="../icons/uk/newmail.ico" alt=""></td></tr>
  <tr><td class="num">6</td><td>lightgrey</td><td><img src="../icons/lightgrey/messengerWindow.ico" alt=""></td><td><img src="../icons/lightgrey/newmail.ico" alt=""></td></tr>
  <tr><td class="num">7</td><td>newmail-sm</td><td></td><td><img src="../icons/newmail-sm/newmail.ico" alt=""> small new-mail icon, option 6 only</td></tr>
</table>
</body>
</html>
